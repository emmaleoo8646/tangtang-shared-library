services:
  postgres:
    image: postgres:17-alpine
    container_name: tangtang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tangtang_library
      POSTGRES_USER: tangtang
      POSTGRES_PASSWORD: tangtang_local_only
    ports:
      - "127.0.0.1:${TANGTANG_DB_PORT:-5432}:5432"
    volumes:
      - tangtang_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tangtang -d tangtang_library"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tangtang_postgres_data:
