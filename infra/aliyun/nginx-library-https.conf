# TANGTANG_LIBRARY_HTTPS_BEGIN
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name library.douwuyou.cn;

    ssl_certificate /etc/letsencrypt/live/library.douwuyou.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.douwuyou.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://tangtang-library-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
# TANGTANG_LIBRARY_HTTPS_END
