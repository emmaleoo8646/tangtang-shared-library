services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tangtang_library
      POSTGRES_USER: tangtang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tangtang -d tangtang_library"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ../..
      dockerfile: infra/aliyun/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      WEB_ORIGIN: https://${SITE_DOMAIN:?set SITE_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TEST_EMAIL_ALLOWLIST: ${TEST_EMAIL_ALLOWLIST:-}
      AI_PROVIDER: minimax
      AI_API_KEY: ${AI_API_KEY:?set AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-MiniMax-M3}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.minimaxi.com/v1}
  web:
    build:
      context: ../..
      dockerfile: infra/aliyun/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
    networks:
      default: {}
      family_diary_edge:
        aliases:
          - tangtang-library-web

volumes:
  postgres_data:

networks:
  family_diary_edge:
    external: true
    name: family-diary_edge
